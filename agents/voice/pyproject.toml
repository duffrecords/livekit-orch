[project]
name = "agent-voice"
version = "0.1.0"
description = "Provider-backed voice agent for livekit-orch"
requires-python = ">=3.10,<3.15"
dependencies = [
    "livekit-agents~=1.8",
    "livekit-plugins-openai~=1.8",
    "livekit-plugins-deepgram~=1.8",
    "livekit-plugins-anthropic~=1.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
