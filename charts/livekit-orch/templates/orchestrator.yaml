{{- $labels := include "livekit-orch.labels" (dict "name" "orchestrator" "root" $) -}}
{{- $image := .Values.orchestrator.image -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  labels:
    {{- $labels | nindent 4 }}
spec:
  # Ended-session history and the reaper live in this process, so run one
  # replica. Live-session calls are stateless.
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
      {{- with $image.id }}
      annotations:
        livekit-orch/image-id: {{ . | quote }}
      {{- end }}
    spec:
      # keep Service-derived LIVEKIT_* variables out of the environment
      enableServiceLinks: false
      containers:
        - name: orchestrator
          image: {{ $image.repository }}:{{ $image.tag }}
          imagePullPolicy: {{ $image.pullPolicy }}
          env:
            - name: LIVEKIT_URL
              value: http://{{ include "livekit-orch.host" (dict "name" "livekit" "root" $) }}:7880
            - name: LIVEKIT_PUBLIC_URL
              value: {{ .Values.orchestrator.publicUrl | quote }}
            # the first is the default
            - name: AGENT_NAMES
              value: {{ include "livekit-orch.agentNames" . | quote }}
            # agent name = headless Service of its worker pods
            - name: WORKER_SERVICES
              value: {{ include "livekit-orch.workerServices" . | quote }}
            - name: SESSION_MAX_SECONDS
              value: {{ int .Values.sessionMaxSeconds | quote }}
            {{- range $key, $value := .Values.orchestrator.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- include "livekit-orch.keysEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          # ready only while the LiveKit server API answers
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  labels:
    {{- $labels | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: {{ .Values.orchestrator.nodePort }}
      protocol: TCP
