{{- define "livekit-orch.livekitConfig" -}}
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  # The advertised address (node_ip) comes from the NODE_IP env var
  # (livekit.nodeIP): host browsers reach the server there through the
  # kind port mappings.
  # Keep the node's real IP as a candidate too, so in-cluster agents
  # (which can't use the host's address) can reach the server.
  advertise_internal_ip: true
  interfaces:
    includes:
      {{- toYaml .Values.livekit.interfaces | nindent 6 }}
# Room and participant lifecycle events go to the orchestrator. They are
# signed with the key named by LIVEKIT_WEBHOOK_API_KEY (set on the pod).
webhook:
  urls:
    - http://{{ include "livekit-orch.host" (dict "name" "orchestrator" "root" $) }}:8080/webhooks/livekit
{{- end }}
{{- $labels := include "livekit-orch.labels" (dict "name" "livekit" "root" $) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  labels:
    {{- $labels | nindent 4 }}
data:
  livekit.yaml: |
    {{- include "livekit-orch.livekitConfig" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  labels:
    {{- $labels | nindent 4 }}
spec:
  replicas: 1
  # hostNetwork ports can't be held by two pods at once
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
      annotations:
        # the server reads its config at startup only
        checksum/config: {{ include "livekit-orch.livekitConfig" . | sha256sum }}
    spec:
      # Each port keeps the same number from the host to the server (the
      # ports are fixed: they have to match kind-config.yaml).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # The `livekit` Service would inject LIVEKIT_PORT=tcp://..., which the
      # server reads as its (numeric) port setting and crashes on.
      enableServiceLinks: false
      containers:
        - name: livekit
          image: {{ .Values.livekit.image.repository }}:{{ .Values.livekit.image.tag }}
          args:
            {{- if .Values.livekit.dev }}
            - --dev
            {{- end }}
            - --bind
            - 0.0.0.0
            - --config
            - /etc/livekit/livekit.yaml
          env:
            - name: NODE_IP
              value: {{ required "livekit.nodeIP is required: the address LiveKit advertises to clients (`make deploy` detects it)" .Values.livekit.nodeIP | quote }}
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.livekitKeys }}
                  key: LIVEKIT_KEYS
            - name: LIVEKIT_WEBHOOK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.livekitKeys }}
                  key: LIVEKIT_API_KEY
          ports:
            - name: signal
              containerPort: 7880
              protocol: TCP
            - name: ice-tcp
              containerPort: 7881
              protocol: TCP
            - name: ice-udp
              containerPort: 7882
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /
              port: 7880
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
      volumes:
        - name: config
          configMap:
            name: livekit-config
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  labels:
    {{- $labels | nindent 4 }}
spec:
  selector:
    app: livekit
  ports:
    - name: signal
      port: 7880
      targetPort: 7880
      protocol: TCP
