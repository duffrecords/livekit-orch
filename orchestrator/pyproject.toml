[project]
name = "orchestrator"
version = "0.1.0"
description = "Session orchestration API for livekit-orch"
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastapi~=0.142",
    "livekit-api~=1.2",
    "uvicorn~=0.54",
]

[dependency-groups]
dev = [
    "httpx2~=2.13",
    "pytest~=9.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
