# The provider-backed voice agent. Applied by `make deploy` only when .env has
# a provider API key; `kubectl apply -f deploy/` does not descend into this
# directory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-voice
  namespace: livekit
  labels:
    app: agent-voice
spec:
  # No `replicas`: the count belongs to the autoscaler (agent-voice-scaling.yaml)
  # and `kubectl apply` would otherwise reset it on every deploy.
  # Add a new pod before asking an old one to drain.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: agent-voice
  template:
    metadata:
      labels:
        app: agent-voice
    spec:
      # keep Service-derived LIVEKIT_* variables out of the worker's environment
      enableServiceLinks: false
      # On SIGTERM the worker stops taking jobs and exits when its last session
      # ends. Sessions are capped at SESSION_MAX_SECONDS (1800) by the
      # orchestrator, so this never cuts one off.
      terminationGracePeriodSeconds: 1860
      containers:
        - name: agent
          image: livekit-orch/agent-voice:dev
          # image is side-loaded with `kind load docker-image`
          imagePullPolicy: Never
          envFrom:
            # VOICE_* settings from .env (provider/model per stage, voice,
            # instructions, greeting); unset ones fall back to agent.py
            - configMapRef:
                name: agent-voice-config
                optional: true
            # OPENAI_API_KEY, DEEPGRAM_API_KEY, ANTHROPIC_API_KEY, as set in .env
            - secretRef:
                name: provider-keys
          env:
            - name: LIVEKIT_URL
              value: ws://livekit.livekit.svc.cluster.local:7880
            # sessions per pod; the autoscaler's target is set relative to this
            - name: MAX_JOBS
              value: "5"
            - name: DRAIN_TIMEOUT_SECONDS
              value: "1800"
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit-keys
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit-keys
                  key: LIVEKIT_API_SECRET
          # Measured: about 65m and 500 MB idle, about 350m and 880 MB with five
          # conversations (roughly 60m and 75 MB each). No CPU limit:
          # throttling would break up audio, and load is counted in jobs
          # rather than CPU.
          resources:
            requests:
              cpu: 400m
              memory: 900Mi
            limits:
              memory: 1536Mi
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
---
# Headless: resolves to the ready worker pods, so the orchestrator can ask each
# one how busy it is (GET :8081/worker). Nothing routes traffic through it;
# workers dial out to LiveKit.
apiVersion: v1
kind: Service
metadata:
  name: agent-voice
  namespace: livekit
spec:
  clusterIP: None
  selector:
    app: agent-voice
  ports:
    - name: health
      port: 8081
      targetPort: health
