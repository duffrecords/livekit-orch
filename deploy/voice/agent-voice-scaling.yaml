# Autoscaling for the voice workers; same scheme as agent-echo-scaling.yaml.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agent-voice
  namespace: livekit
spec:
  scaleTargetRef:
    name: agent-voice
  minReplicaCount: 1
  # lower than echo's 6: both fleets share one node and its 8 GB
  maxReplicaCount: 3
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
        scaleDown:
          stabilizationWindowSeconds: 60
  triggers:
    - type: metrics-api
      metadata:
        url: http://orchestrator.livekit.svc.cluster.local:8080/scaling/voice
        valueLocation: sessions
        # Sessions per pod to aim for: replicas = ceil(sessions / 3), against
        # MAX_JOBS (5) per pod.
        targetValue: "3"
