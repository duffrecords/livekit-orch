# Autoscaling for the echo workers. KEDA turns this into an ordinary
# HorizontalPodAutoscaler (`kubectl -n livekit get hpa`) fed by the
# orchestrator's count of sessions that need an echo worker.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agent-echo
  namespace: livekit
spec:
  scaleTargetRef:
    name: agent-echo
  minReplicaCount: 1
  maxReplicaCount: 6
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
        # Short, so a demo shows the scale-down. A removed pod drains its
        # sessions first, so a wrong guess costs nothing but pod churn.
        scaleDown:
          stabilizationWindowSeconds: 60
  triggers:
    - type: metrics-api
      metadata:
        url: http://orchestrator.livekit.svc.cluster.local:8080/scaling/echo
        valueLocation: sessions
        # Sessions per pod to aim for: replicas = ceil(sessions / 3). A pod
        # holds MAX_JOBS (5), so the fleet runs about 60 % full. The spare
        # slots matter: LiveKit drops a dispatch that no worker can take.
        targetValue: "3"
